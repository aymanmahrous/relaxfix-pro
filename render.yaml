services:
  - type: web
    name: relaxfix-pro
    env: node
    plan: standard
    
    # Build configuration
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm run start
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: VITE_OAUTH_PORTAL_URL
        value: https://portal.manus.im
      - key: JWT_SECRET
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        value: https://forge.manus.im
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        value: https://forge.manus.im
      - key: VITE_ANALYTICS_ENDPOINT
        sync: false
      - key: VITE_ANALYTICS_WEBSITE_ID
        sync: false
    
    # Auto-deploy on push
    autoDeployOnPush: true
    
    # Health check
    healthCheckPath: /
    
    # Scaling
    numInstances: 1
    
    # Disk
    disk:
      name: relaxfix-pro-disk
      mountPath: /data
      sizeGB: 10
